name: public-surface

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed public tip
        run: git verify-commit HEAD
      - name: Reject exposed Git identities in reachable history
        run: |
          ! git log --all --format='%ae%n%ce' | grep -Ei '@(thalesgroup|thales)\.com$'
      - name: Verify public claims and release evidence
        run: python3 scripts/check_public_surface.py
