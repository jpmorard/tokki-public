name: public-surface

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify signed public tip
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"
          git verify-commit "$TARGET_SHA"
      - name: Reject exposed Git identities in reachable history
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ! git log "$TARGET_SHA" --format='%ae%n%ce' | grep -Ei '@(thalesgroup|thales)\.com$'
      - name: Verify public claims and release evidence
        run: python3 scripts/check_public_surface.py
