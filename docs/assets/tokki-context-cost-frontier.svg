<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" role="img" aria-labelledby="cost-en-title cost-en-desc" xml:lang="en" font-family="Arial, Helvetica, sans-serif">
  <title id="cost-en-title">How much input reaches the model?</title>
  <desc id="cost-en-desc">Two September 2026 tasks used 11,989 baseline tokens or 1,736 with Tokki. The table projects the observed fraction across one million baseline tokens for four models at November 20, 2026 standard uncached input prices.</desc>
  <rect x="1" y="1" width="698" height="538" fill="#ffffff" rx="12"/>
  <text x="26" y="40" font-size="27" font-weight="700" fill="#192d3a" text-anchor="start">How much input reaches the model?</text>
  <text x="26" y="68" font-size="16" font-weight="400" fill="#425769" text-anchor="start">Measured on two tasks · September 17, 2026</text>
  <text x="26" y="111" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">Baseline</text>
  <rect x="150" y="94" width="360" height="17" fill="#50667b" rx="2"/>
  <text x="645" y="110" font-size="19" font-weight="550" fill="#253a49" text-anchor="end">11,989 tokens</text>
  <text x="26" y="153" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">With Tokki</text>
  <rect x="150" y="136" width="52.12778380181833" height="17" fill="#00715c" rx="2"/>
  <text x="645" y="152" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">1,736 tokens</text>
  <rect x="26" y="180" width="626" height="1" fill="#cbd4d8" rx="0"/>
  <text x="26" y="218" font-size="24" font-weight="700" fill="#192d3a" text-anchor="start">Projected input cost</text>
  <text x="26" y="246" font-size="16" font-weight="400" fill="#425769" text-anchor="start">1 million baseline tokens across requests</text>
  <text x="30" y="285" font-size="16" font-weight="600" fill="#192d3a" text-anchor="start">Model</text>
  <text x="455" y="285" font-size="16" font-weight="600" fill="#283b47" text-anchor="end">Baseline (USD)</text>
  <text x="642" y="285" font-size="16" font-weight="600" fill="#00634f" text-anchor="end">With Tokki (USD)</text>
  <rect x="18" y="303" width="644" height="37" fill="#f1f5f6" rx="3"/>
  <text x="30" y="328" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">GPT-6.2 Astra</text>
  <text x="455" y="328" font-size="19" font-weight="450" fill="#283b47" text-anchor="end">$8.00</text>
  <text x="642" y="328" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">$1.16</text>
  <rect x="18" y="342" width="644" height="37" fill="#ffffff" rx="3"/>
  <text x="30" y="367" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">GPT-6.2 Sol</text>
  <text x="455" y="367" font-size="19" font-weight="450" fill="#283b47" text-anchor="end">$2.00</text>
  <text x="642" y="367" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">$0.29</text>
  <rect x="18" y="381" width="644" height="37" fill="#f1f5f6" rx="3"/>
  <text x="30" y="406" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">GPT-6.1 Terra</text>
  <text x="455" y="406" font-size="19" font-weight="450" fill="#283b47" text-anchor="end">$1.00</text>
  <text x="642" y="406" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">$0.14</text>
  <rect x="18" y="420" width="644" height="37" fill="#ffffff" rx="3"/>
  <text x="30" y="445" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">GPT-6 Luna</text>
  <text x="455" y="445" font-size="19" font-weight="450" fill="#283b47" text-anchor="end">$0.10</text>
  <text x="642" y="445" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">$0.014</text>
  <text x="26" y="488" font-size="15" font-weight="400" fill="#425769" text-anchor="start">Standard uncached input · Nov 20, 2026</text>
  <text x="26" y="513" font-size="15" font-weight="400" fill="#425769" text-anchor="start">Same token ratio throughout. Input charges only.</text>
</svg>
