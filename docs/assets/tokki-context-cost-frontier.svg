<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="700" height="420" role="img" aria-labelledby="ctxcost-title ctxcost-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ctxcost-title">Dated benchmark snapshot cost in euro, GPT-5.6 tiers</title>
  <desc id="ctxcost-desc">Log-scale dot plot in euro for a benchmark snapshot captured on 2026-07-31. For that reported capture, exact gpt-4o counting reduced 9,448 baseline input tokens to 2,766 Tokki evidence tokens, a 3.4-fold compression; later reruns can differ. Using standard GPT-5.6 input prices read from the OpenAI model cards on 2026-07-31 and the ECB euro reference rate of 1.1476 US dollars per euro for 2026-07-30, projected input cost falls from 0.0412 to 0.0121 euro on Sol, 0.0165 to 0.0048 euro on Terra, and from 0.00165 to 0.00048 euro on Luna. The compression ratio for this snapshot is independent of the selected price.</desc>

  <defs>
    <clipPath id="ctxcost-plot-clip">
      <rect x="240" y="240" width="890" height="300"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <!-- Header -->
  <text x="48" y="76" font-size="34" font-weight="700" fill="#172026">Dated benchmark snapshot cost, GPT-5.6</text>
  <text x="48" y="112" font-size="20" fill="#475569">2026-07-31: 9,448 to 2,766 input tokens, 3.4x</text>

  <!-- Legend -->
  <circle cx="60" cy="158" r="9" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <text x="80" y="165" font-size="19" fill="#334155">Baseline context</text>
  <circle cx="330" cy="158" r="9" fill="#2563eb"/>
  <text x="350" y="165" font-size="19" fill="#334155">Tokki evidence</text>

  <!-- Axis gridlines (log decades) -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="240" y1="240" x2="240" y2="540"/>
    <line x1="537" y1="240" x2="537" y2="540"/>
    <line x1="833" y1="240" x2="833" y2="540"/>
    <line x1="1130" y1="240" x2="1130" y2="540"/>
  </g>
  <g font-size="18" fill="#64748b" text-anchor="middle">
    <text x="240" y="568">&#8364;0.0001</text>
    <text x="537" y="568">&#8364;0.001</text>
    <text x="833" y="568">&#8364;0.01</text>
    <text x="1130" y="568">&#8364;0.10</text>
  </g>
  <text x="685" y="600" font-size="18" fill="#64748b" text-anchor="middle">Projected input cost (log scale)</text>

  <!-- Connectors -->
  <g clip-path="url(#ctxcost-plot-clip)">
    <line x1="857" y1="300" x2="1016" y2="300" stroke="#94a3b8" stroke-width="3"/>
    <line x1="739" y1="400" x2="898" y2="400" stroke="#94a3b8" stroke-width="3"/>
    <line x1="443" y1="500" x2="601" y2="500" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <g>
    <text x="48" y="292" font-size="22" font-weight="600" fill="#172026">GPT-5.6 Sol</text>
    <text x="48" y="316" font-size="18" fill="#64748b">&#8364;4.36 / M in</text>
    <circle cx="1016" cy="300" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle cx="857" cy="300" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text x="1035" y="307" font-size="20" fill="#334155">&#8364;0.0412</text>
    <text x="857" y="278" font-size="20" fill="#334155" text-anchor="middle">&#8364;0.0121</text>
  </g>

  <g>
    <text x="48" y="392" font-size="22" font-weight="600" fill="#172026">GPT-5.6 Terra</text>
    <text x="48" y="416" font-size="18" fill="#64748b">&#8364;1.74 / M in</text>
    <circle cx="898" cy="400" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle cx="739" cy="400" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text x="917" y="407" font-size="20" fill="#334155">&#8364;0.0165</text>
    <text x="739" y="378" font-size="20" fill="#334155" text-anchor="middle">&#8364;0.0048</text>
  </g>

  <g>
    <text x="48" y="492" font-size="22" font-weight="600" fill="#172026">GPT-5.6 Luna</text>
    <text x="48" y="516" font-size="18" fill="#64748b">&#8364;0.174 / M in</text>
    <circle cx="601" cy="500" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle cx="443" cy="500" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text x="620" y="507" font-size="20" fill="#334155">&#8364;0.00165</text>
    <text x="443" y="478" font-size="20" fill="#334155" text-anchor="middle">&#8364;0.00048</text>
  </g>

  <!-- Callout -->
  <rect x="48" y="620" width="560" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="650" font-size="20" font-weight="600" fill="#1e40af">Compaction rides on top of the tier</text>
  <text x="70" y="676" font-size="18" fill="#334155">Same 3.4x gap on every row; tier shifts it.</text>

  <!-- Provenance -->
  <text x="640" y="638" font-size="16" fill="#64748b">Dated snapshot, exact gpt-4o counts.</text>
  <text x="640" y="658" font-size="16" fill="#64748b">Grade A, 2 scenarios, 2026-07-31.</text>
  <text x="640" y="678" font-size="16" fill="#64748b">Model cards read 2026-07-31; ECB 1.1476.</text>
  <text x="640" y="698" font-size="16" fill="#64748b">Projected cost, not billing evidence.</text>
</svg>
