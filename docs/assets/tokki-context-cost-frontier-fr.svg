<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="700" height="420" role="img" aria-labelledby="ctxcostfr-title ctxcostfr-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ctxcostfr-title">Coût d’entrée projeté, avec GPT-6 Astra</title>
  <desc id="ctxcostfr-desc">Graphe logarithmique de coûts d’entrée projetés, incluant GPT-6 Astra. Snapshot de 2 scénarios capturé le 2026-07-31 : 9 448 tokens de référence et 2 766 tokens avec Tokki, comptés avec gpt-4o, soit 3,4x ; une exécution ultérieure peut différer. Il ne s’agit pas d’un recomptage avec les modèles affichés, ni d’une mesure de leur qualité : ce n’est pas un benchmark Astra. Tarifs OpenAI standard d’entrée non mise en cache vérifiés le 2026-09-17 : Astra 10,00, Sol 4,00, Terra 2,00 et Luna 0,20 dollars par million de tokens. Taux de change historique fixe BCE du 2026-07-30 : 1,1476 dollar par euro. Projections référence → Tokki : Astra 0,0823 → 0,0241 euro ; Sol 0,0329 → 0,0096 ; Terra 0,0165 → 0,0048 ; Luna 0,00165 → 0,00048. Estimation limitée aux entrées, hors sorties, cache, outils et quotas d’abonnement Codex ; pas une preuve de facturation.</desc>
  <!-- Standard API input prices, checked 2026-09-17:
       https://developers.openai.com/api/docs/models/gpt-6-astra
       https://developers.openai.com/api/docs/models/gpt-5.6-sol
       https://developers.openai.com/api/docs/models/gpt-5.6-terra
       https://developers.openai.com/api/docs/models/gpt-5.6-luna
       Fixed FX source: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
       Cost = snapshot tokens × USD per million / 1000000 / 1.1476.
       Log axis: x = 300 + log10(cost / 0.0001) × 820 / 3. -->
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="48" y="64" font-size="34" font-weight="700" fill="#172026">Coût d’entrée projeté, avec GPT-6 Astra</text>
  <text x="48" y="104" font-size="22" fill="#475569">Même snapshot : 9 448 → 2 766 tokens, soit 3,4x</text>
  <circle cx="60" cy="156" r="10" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <text x="82" y="163" font-size="21" fill="#334155">Contexte de référence</text>
  <circle cx="370" cy="156" r="10" fill="#2563eb"/>
  <text x="392" y="163" font-size="21" fill="#334155">Contexte avec Tokki</text>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="300.0" y1="204" x2="300.0" y2="536"/>
    <line x1="573.3" y1="204" x2="573.3" y2="536"/>
    <line x1="846.7" y1="204" x2="846.7" y2="536"/>
    <line x1="1120.0" y1="204" x2="1120.0" y2="536"/>
  </g>
  <g font-size="20" fill="#475569" text-anchor="middle">
    <text x="300.0" y="568">0,0001 €</text>
    <text x="573.3" y="568">0,001 €</text>
    <text x="846.7" y="568">0,01 €</text>
    <text x="1120.0" y="568">0,10 €</text>
  </g>
  <text x="710" y="600" font-size="20" fill="#475569" text-anchor="middle">Coût d’entrée estimé · échelle logarithmique</text>
  <g id="cost-astra">
    <text x="48" y="250" font-size="24" font-weight="600" fill="#172026">GPT-6 Astra</text>
    <text x="48" y="277" font-size="20" fill="#475569">8,71 € / M entrée</text>
    <line x1="951.1" y1="254" x2="1096.9" y2="254" stroke="#94a3b8" stroke-width="3"/>
    <circle id="astra-baseline" cx="1096.9" cy="254" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle id="astra-tokki" cx="951.1" cy="254" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text id="astra-baseline-cost" x="1096.9" y="230" font-size="22" fill="#334155" text-anchor="middle">0,0823 €</text>
    <text id="astra-tokki-cost" x="951.1" y="230" font-size="22" font-weight="600" fill="#1e40af" text-anchor="middle">0,0241 €</text>
  </g>
  <g id="cost-sol">
    <text x="48" y="330" font-size="24" font-weight="600" fill="#172026">GPT-5.6 Sol</text>
    <text x="48" y="357" font-size="20" fill="#475569">3,49 € / M entrée</text>
    <line x1="842.3" y1="334" x2="988.1" y2="334" stroke="#94a3b8" stroke-width="3"/>
    <circle id="sol-baseline" cx="988.1" cy="334" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle id="sol-tokki" cx="842.3" cy="334" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text id="sol-baseline-cost" x="988.1" y="310" font-size="22" fill="#334155" text-anchor="middle">0,0329 €</text>
    <text id="sol-tokki-cost" x="842.3" y="310" font-size="22" font-weight="600" fill="#1e40af" text-anchor="middle">0,0096 €</text>
  </g>
  <g id="cost-terra">
    <text x="48" y="410" font-size="24" font-weight="600" fill="#172026">GPT-5.6 Terra</text>
    <text x="48" y="437" font-size="20" fill="#475569">1,74 € / M entrée</text>
    <line x1="760.0" y1="414" x2="905.9" y2="414" stroke="#94a3b8" stroke-width="3"/>
    <circle id="terra-baseline" cx="905.9" cy="414" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle id="terra-tokki" cx="760.0" cy="414" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text id="terra-baseline-cost" x="905.9" y="390" font-size="22" fill="#334155" text-anchor="middle">0,0165 €</text>
    <text id="terra-tokki-cost" x="760.0" y="390" font-size="22" font-weight="600" fill="#1e40af" text-anchor="middle">0,0048 €</text>
  </g>
  <g id="cost-luna">
    <text x="48" y="490" font-size="24" font-weight="600" fill="#172026">GPT-5.6 Luna</text>
    <text x="48" y="517" font-size="20" fill="#475569">0,174 € / M entrée</text>
    <line x1="486.7" y1="494" x2="632.5" y2="494" stroke="#94a3b8" stroke-width="3"/>
    <circle id="luna-baseline" cx="632.5" cy="494" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle id="luna-tokki" cx="486.7" cy="494" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text id="luna-baseline-cost" x="632.5" y="470" font-size="22" fill="#334155" text-anchor="middle">0,00165 €</text>
    <text id="luna-tokki-cost" x="486.7" y="470" font-size="22" font-weight="600" fill="#1e40af" text-anchor="middle">0,00048 €</text>
  </g>
  <rect x="48" y="620" width="454" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="68" y="650" font-size="24" font-weight="600" fill="#1e40af">Entrée divisée par 3,4</text>
  <text x="68" y="680" font-size="20" fill="#334155">≈ 70,7 % de coût d’entrée en moins</text>
  <g font-size="18" fill="#475569">
    <text x="528" y="634">Snapshot : 2026-07-31 · comptage gpt-4o</text>
    <text x="528" y="655">Tarifs : 2026-09-17 · entrée standard hors cache</text>
    <text x="528" y="676">Change fixe : 1 € = 1,1476 $ · BCE 2026-07-30</text>
    <text x="528" y="697">Estimation ; hors sorties et quotas Codex.</text>
  </g>
</svg>
