<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" role="img" aria-labelledby="cost-fr-title cost-fr-desc" xml:lang="fr" font-family="Arial, Helvetica, sans-serif">
  <title id="cost-fr-title">Combien de tokens le modèle reçoit-il ?</title>
  <desc id="cost-fr-desc">Deux tâches de septembre 2026 totalisaient 11 989 tokens en entrée, ou 1 736 avec Tokki. Le tableau applique la même proportion à un million de tokens aux tarifs standard hors cache du 20 novembre 2026, pour quatre modèles.</desc>
  <rect x="1" y="1" width="698" height="538" fill="#ffffff" rx="12"/>
  <text x="26" y="40" font-size="27" font-weight="700" fill="#192d3a" text-anchor="start">Combien de tokens le modèle reçoit-il ?</text>
  <text x="26" y="68" font-size="16" font-weight="400" fill="#425769" text-anchor="start">Mesure sur deux tâches · 17 septembre 2026</text>
  <text x="26" y="111" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">Référence</text>
  <rect x="150" y="94" width="360" height="17" fill="#50667b" rx="2"/>
  <text x="645" y="110" font-size="19" font-weight="550" fill="#253a49" text-anchor="end">11 989 tokens</text>
  <text x="26" y="153" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">Avec Tokki</text>
  <rect x="150" y="136" width="52.12778380181833" height="17" fill="#00715c" rx="2"/>
  <text x="645" y="152" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">1 736 tokens</text>
  <rect x="26" y="180" width="626" height="1" fill="#cbd4d8" rx="0"/>
  <text x="26" y="218" font-size="24" font-weight="700" fill="#192d3a" text-anchor="start">Coût d’entrée projeté</text>
  <text x="26" y="246" font-size="16" font-weight="400" fill="#425769" text-anchor="start">1 million de tokens de référence cumulés</text>
  <text x="30" y="285" font-size="16" font-weight="600" fill="#192d3a" text-anchor="start">Modèle</text>
  <text x="455" y="285" font-size="16" font-weight="600" fill="#283b47" text-anchor="end">Référence (EUR)</text>
  <text x="642" y="285" font-size="16" font-weight="600" fill="#00634f" text-anchor="end">Avec Tokki (EUR)</text>
  <rect x="18" y="303" width="644" height="37" fill="#f1f5f6" rx="3"/>
  <text x="30" y="328" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">GPT-6.2 Astra</text>
  <text x="455" y="328" font-size="19" font-weight="450" fill="#283b47" text-anchor="end">7,28 €</text>
  <text x="642" y="328" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">1,05 €</text>
  <rect x="18" y="342" width="644" height="37" fill="#ffffff" rx="3"/>
  <text x="30" y="367" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">GPT-6.2 Sol</text>
  <text x="455" y="367" font-size="19" font-weight="450" fill="#283b47" text-anchor="end">1,82 €</text>
  <text x="642" y="367" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">0,26 €</text>
  <rect x="18" y="381" width="644" height="37" fill="#f1f5f6" rx="3"/>
  <text x="30" y="406" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">GPT-6.1 Terra</text>
  <text x="455" y="406" font-size="19" font-weight="450" fill="#283b47" text-anchor="end">0,91 €</text>
  <text x="642" y="406" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">0,13 €</text>
  <rect x="18" y="420" width="644" height="37" fill="#ffffff" rx="3"/>
  <text x="30" y="445" font-size="18" font-weight="550" fill="#192d3a" text-anchor="start">GPT-6 Luna</text>
  <text x="455" y="445" font-size="19" font-weight="450" fill="#283b47" text-anchor="end">0,09 €</text>
  <text x="642" y="445" font-size="19" font-weight="700" fill="#00634f" text-anchor="end">0,013 €</text>
  <text x="26" y="488" font-size="15" font-weight="400" fill="#425769" text-anchor="start">Entrée standard hors cache · 20 nov. 2026</text>
  <text x="26" y="513" font-size="15" font-weight="400" fill="#425769" text-anchor="start">BCE, 20 nov. 2026 · 1 € = 1,0990 $US</text>
