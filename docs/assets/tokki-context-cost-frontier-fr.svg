<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="700" height="420" role="img" aria-labelledby="ctxcostfr-title ctxcostfr-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ctxcostfr-title">Coût pour 1 million de tokens de référence</title>
  <desc id="ctxcostfr-desc">Projection en euros pour 1,000 M de tokens d’entrée de référence cumulés sur plusieurs requêtes, soit environ 0,145 M de tokens avec Tokki, au ratio mesuré de 6,9x. Nouvelle capture locale du 2026-09-17 avec Tokki 1.0.63 : 2 scénarios disponibles, 11 989 tokens de référence et 1 736 tokens avec Tokki, comptés exactement avec gpt-4o (grade A) ; une exécution ultérieure peut différer. La projection applique ce ratio à un million de tokens ; ce n’est pas une mesure sur un million de tokens, ni un comptage natif des modèles affichés ou une mesure de leur qualité : ce n’est pas un benchmark Astra. Tarifs OpenAI standard d’entrée non mise en cache vérifiés le 2026-09-17 : Astra 10,00, Sol 4,00, Terra 2,00 et Luna 0,20 dollars par million de tokens. Chaque requête est supposée contenir au plus 272 000 tokens d’entrée, sans majoration de contexte long. Taux BCE du 2026-09-17 : 1,1481 dollar par euro. Coûts projetés référence → Tokki : Astra 8,71 → 1,26 euros ; Sol 3,48 → 0,50 ; Terra 1,74 → 0,25 ; Luna 0,1742 → 0,0252. Hors sorties, cache, outils et quotas Codex ; pas une preuve de facturation. Scénarios de logs indisponibles exclus. Relevé agrégé : token-cost-snapshot-2026-09-17.json ; entrées privées.</desc>
  <!-- Standard API input prices, checked 2026-09-17:
       https://developers.openai.com/api/docs/models/gpt-6-astra
       https://developers.openai.com/api/docs/models/gpt-5.6-sol
       https://developers.openai.com/api/docs/models/gpt-5.6-terra
       https://developers.openai.com/api/docs/models/gpt-5.6-luna
       FX source: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/eurofxref-graph-usd.en.html
       Cost = (measured tokens / measured baseline) × USD per million / 1.1481.
       Log axis: x = 300 + log10(cost / 0.01) × 852 / log10(2000). -->
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="48" y="64" font-size="34" font-weight="700" fill="#172026">Coût pour 1 million de tokens de référence</text>
  <text x="48" y="104" font-size="22" fill="#475569">1,000 M → 0,145 M tokens (ratio 6,9x)</text>
  <circle cx="60" cy="156" r="10" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <text x="82" y="163" font-size="21" fill="#334155">Contexte de référence</text>
  <circle cx="370" cy="156" r="10" fill="#2563eb"/>
  <text x="392" y="163" font-size="21" fill="#334155">Contexte avec Tokki</text>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="300.0" y1="204" x2="300.0" y2="536"/>
    <line x1="558.1" y1="204" x2="558.1" y2="536"/>
    <line x1="816.2" y1="204" x2="816.2" y2="536"/>
    <line x1="1074.3" y1="204" x2="1074.3" y2="536"/>
    <line x1="1152.0" y1="204" x2="1152.0" y2="536"/>
  </g>
  <g font-size="20" fill="#475569" text-anchor="middle">
    <text x="300.0" y="568">0,01 €</text>
    <text x="558.1" y="568">0,10 €</text>
    <text x="816.2" y="568">1 €</text>
    <text x="1074.3" y="568">10 €</text>
    <text x="1152.0" y="568">20 €</text>
  </g>
  <text x="710" y="600" font-size="20" fill="#475569" text-anchor="middle">Coût d’entrée estimé · échelle logarithmique</text>
  <g id="cost-astra">
    <text x="48" y="250" font-size="24" font-weight="600" fill="#172026">GPT-6 Astra</text>
    <text x="48" y="277" font-size="20" fill="#475569">8,71 € / M entrée</text>
    <line x1="842.2" y1="254" x2="1058.8" y2="254" stroke="#94a3b8" stroke-width="3"/>
    <circle id="astra-baseline" cx="1058.8" cy="254" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle id="astra-tokki" cx="842.2" cy="254" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text id="astra-baseline-cost" x="1058.8" y="230" font-size="22" fill="#334155" text-anchor="middle">8,71 €</text>
    <text id="astra-tokki-cost" x="842.2" y="230" font-size="22" font-weight="600" fill="#1e40af" text-anchor="middle">1,26 €</text>
  </g>
  <g id="cost-sol">
    <text x="48" y="330" font-size="24" font-weight="600" fill="#172026">GPT-5.6 Sol</text>
    <text x="48" y="357" font-size="20" fill="#475569">3,48 € / M entrée</text>
    <line x1="739.5" y1="334" x2="956.1" y2="334" stroke="#94a3b8" stroke-width="3"/>
    <circle id="sol-baseline" cx="956.1" cy="334" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle id="sol-tokki" cx="739.5" cy="334" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text id="sol-baseline-cost" x="956.1" y="310" font-size="22" fill="#334155" text-anchor="middle">3,48 €</text>
    <text id="sol-tokki-cost" x="739.5" y="310" font-size="22" font-weight="600" fill="#1e40af" text-anchor="middle">0,50 €</text>
  </g>
  <g id="cost-terra">
    <text x="48" y="410" font-size="24" font-weight="600" fill="#172026">GPT-5.6 Terra</text>
    <text x="48" y="437" font-size="20" fill="#475569">1,74 € / M entrée</text>
    <line x1="661.8" y1="414" x2="878.4" y2="414" stroke="#94a3b8" stroke-width="3"/>
    <circle id="terra-baseline" cx="878.4" cy="414" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle id="terra-tokki" cx="661.8" cy="414" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text id="terra-baseline-cost" x="878.4" y="390" font-size="22" fill="#334155" text-anchor="middle">1,74 €</text>
    <text id="terra-tokki-cost" x="661.8" y="390" font-size="22" font-weight="600" fill="#1e40af" text-anchor="middle">0,25 €</text>
  </g>
  <g id="cost-luna">
    <text x="48" y="490" font-size="24" font-weight="600" fill="#172026">GPT-5.6 Luna</text>
    <text x="48" y="517" font-size="20" fill="#475569">0,174 € / M entrée</text>
    <line x1="403.7" y1="494" x2="620.3" y2="494" stroke="#94a3b8" stroke-width="3"/>
    <circle id="luna-baseline" cx="620.3" cy="494" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle id="luna-tokki" cx="403.7" cy="494" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text id="luna-baseline-cost" x="620.3" y="470" font-size="22" fill="#334155" text-anchor="middle">0,1742 €</text>
    <text id="luna-tokki-cost" x="403.7" y="470" font-size="22" font-weight="600" fill="#1e40af" text-anchor="middle">0,0252 €</text>
  </g>
  <rect x="48" y="620" width="454" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="68" y="650" font-size="24" font-weight="600" fill="#1e40af">Entrée divisée par 6,9</text>
  <text x="68" y="680" font-size="20" fill="#334155">≈ 85,5 % de coût d’entrée en moins</text>
  <g font-size="18" fill="#475569">
    <text x="528" y="634">Mesure : 2026-09-17 · comptage gpt-4o</text>
    <text x="528" y="655">Tarifs et BCE : 2026-09-17 · 1 € = 1,1481 $</text>
    <text x="528" y="676">1 M de tokens cumulés · requêtes ≤272k</text>
    <text x="528" y="697">Entrées seules ; projection, pas mesure à 1 M.</text>
  </g>
</svg>
