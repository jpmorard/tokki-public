<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="700" height="420" role="img" aria-labelledby="ctxcostfr-title ctxcostfr-desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ctxcostfr-title">Coût en euros d'un benchmark daté, paliers GPT-5.6</title>
  <desc id="ctxcostfr-desc">Graphe à points en échelle logarithmique, en euros, pour un snapshot benchmark capturé le 2026-07-31. Pour cette capture déclarée, le comptage exact gpt-4o a ramené 9 448 tokens d'entrée de référence à 2 766 tokens d'évidence Tokki, soit une compression de 3,4 fois ; une exécution ultérieure peut différer. Avec les tarifs d'entrée standard lus sur les fiches modèle OpenAI le 2026-07-31 et le taux de référence BCE de 1,1476 dollar par euro du 2026-07-30, le coût d'entrée projeté passe de 0,0412 à 0,0121 euro sur Sol, de 0,0165 à 0,0048 euro sur Terra, et de 0,00165 à 0,00048 euro sur Luna. Pour ce snapshot, le taux de compression ne dépend pas du tarif sélectionné.</desc>

  <defs>
    <clipPath id="ctxcostfr-plot-clip">
      <rect x="240" y="240" width="890" height="300"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>

  <!-- En-tête -->
  <text x="48" y="76" font-size="34" font-weight="700" fill="#172026">Coût du benchmark daté, GPT-5.6</text>
  <text x="48" y="112" font-size="20" fill="#475569">2026-07-31 : 9 448 à 2 766 tokens, soit 3,4x</text>

  <!-- Légende -->
  <circle cx="60" cy="158" r="9" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
  <text x="80" y="165" font-size="19" fill="#334155">Contexte de référence</text>
  <circle cx="340" cy="158" r="9" fill="#2563eb"/>
  <text x="360" y="165" font-size="19" fill="#334155">Évidence Tokki</text>

  <!-- Repères logarithmiques -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="240" y1="240" x2="240" y2="540"/>
    <line x1="537" y1="240" x2="537" y2="540"/>
    <line x1="833" y1="240" x2="833" y2="540"/>
    <line x1="1130" y1="240" x2="1130" y2="540"/>
  </g>
  <g font-size="18" fill="#64748b" text-anchor="middle">
    <text x="240" y="568">0,0001&#160;&#8364;</text>
    <text x="537" y="568">0,001&#160;&#8364;</text>
    <text x="833" y="568">0,01&#160;&#8364;</text>
    <text x="1130" y="568">0,10&#160;&#8364;</text>
  </g>
  <text x="685" y="600" font-size="18" fill="#64748b" text-anchor="middle">Coût d'entrée projeté (échelle log)</text>

  <!-- Connecteurs -->
  <g clip-path="url(#ctxcostfr-plot-clip)">
    <line x1="857" y1="300" x2="1016" y2="300" stroke="#94a3b8" stroke-width="3"/>
    <line x1="739" y1="400" x2="898" y2="400" stroke="#94a3b8" stroke-width="3"/>
    <line x1="443" y1="500" x2="601" y2="500" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <g>
    <text x="48" y="292" font-size="22" font-weight="600" fill="#172026">GPT-5.6 Sol</text>
    <text x="48" y="316" font-size="18" fill="#64748b">4,36&#160;&#8364; / M entrée</text>
    <circle cx="1016" cy="300" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle cx="857" cy="300" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text x="1035" y="307" font-size="20" fill="#334155">0,0412&#160;&#8364;</text>
    <text x="857" y="278" font-size="20" fill="#334155" text-anchor="middle">0,0121&#160;&#8364;</text>
  </g>

  <g>
    <text x="48" y="392" font-size="22" font-weight="600" fill="#172026">GPT-5.6 Terra</text>
    <text x="48" y="416" font-size="18" fill="#64748b">1,74&#160;&#8364; / M entrée</text>
    <circle cx="898" cy="400" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle cx="739" cy="400" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text x="917" y="407" font-size="20" fill="#334155">0,0165&#160;&#8364;</text>
    <text x="739" y="378" font-size="20" fill="#334155" text-anchor="middle">0,0048&#160;&#8364;</text>
  </g>

  <g>
    <text x="48" y="492" font-size="22" font-weight="600" fill="#172026">GPT-5.6 Luna</text>
    <text x="48" y="516" font-size="18" fill="#64748b">0,174&#160;&#8364; / M entrée</text>
    <circle cx="601" cy="500" r="11" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle cx="443" cy="500" r="11" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    <text x="620" y="507" font-size="20" fill="#334155">0,00165&#160;&#8364;</text>
    <text x="443" y="478" font-size="20" fill="#334155" text-anchor="middle">0,00048&#160;&#8364;</text>
  </g>

  <!-- Encadré -->
  <rect x="48" y="620" width="560" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="70" y="650" font-size="20" font-weight="600" fill="#1e40af">La compaction s'ajoute au palier</text>
  <text x="70" y="676" font-size="18" fill="#334155">Même écart 3,4x partout ; le palier décale.</text>

  <!-- Provenance -->
  <text x="640" y="638" font-size="16" fill="#64748b">Snapshot daté, comptage exact gpt-4o.</text>
  <text x="640" y="658" font-size="16" fill="#64748b">Grade A, 2 scénarios, 2026-07-31.</text>
  <text x="640" y="678" font-size="16" fill="#64748b">Fiches lues le 2026-07-31 ; BCE 1,1476.</text>
  <text x="640" y="698" font-size="16" fill="#64748b">Coût projeté, pas une preuve de facturation.</text>
</svg>
